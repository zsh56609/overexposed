<!doctype html>
<!-- Dev-only embed check: the game in an itch-style iframe at the sizes that matter, with a
     fullscreen button like itch's. Run `npm run dev`, then open /check/embed.html.
     Not part of the build (Vite builds index.html only). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed check</title>
    <style>
      body { margin: 0; padding: 12px; background: #222; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
      #controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
      #readout { font-family: ui-monospace, monospace; }
      #wrap { background: #000; }
      #wrap iframe { display: block; width: 100%; height: 100%; border: 0; }
      #wrap:fullscreen { width: 100vw !important; height: 100vh !important; }
    </style>
  </head>
  <body>
    <div id="controls">
      <button data-size="1280x720">1280×720</button>
      <button data-size="1024x576">1024×576</button>
      <button data-size="800x450">800×450</button>
      <button data-size="844x390">844×390 phone</button>
      <button data-size="667x375">667×375 phone</button>
      <button id="fullscreen">Fullscreen</button>
      <span id="readout"></span>
    </div>
    <div id="wrap"><iframe id="game" src="../" title="Overexposed" allowfullscreen></iframe></div>
    <script>
      const wrap = document.getElementById('wrap');
      const game = document.getElementById('game');
      const readout = document.getElementById('readout');
      const size = (w, h) => {
        wrap.style.width = `${w}px`;
        wrap.style.height = `${h}px`;
      };
      for (const b of document.querySelectorAll('[data-size]')) {
        b.addEventListener('click', () => size(...b.dataset.size.split('x').map(Number)));
      }
      document.getElementById('fullscreen').addEventListener('click', () => {
        if (wrap.requestFullscreen) wrap.requestFullscreen();
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
      });
      // What the player gets at this size: the stage's scale and the body text size it yields.
      setInterval(() => {
        const stage = game.contentDocument && game.contentDocument.querySelector('.stage');
        if (!stage) return;
        const r = stage.getBoundingClientRect();
        const scale = r.width / 1280;
        const body = parseFloat(getComputedStyle(stage).fontSize) * scale;
        readout.textContent =
          `frame ${game.clientWidth}×${game.clientHeight} · stage ${Math.round(r.width)}×${Math.round(r.height)} ` +
          `at (${Math.round(r.left)}, ${Math.round(r.top)}) · scale ${scale.toFixed(3)} · body text ${body.toFixed(1)}px`;
      }, 250);
      size(800, 450);
    </script>
  </body>
</html>
