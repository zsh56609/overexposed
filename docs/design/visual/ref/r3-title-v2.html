/* scene helpers from the cover (glow, fig, SCENES): the same drawing code the photo worker uses */
const lg=(g,x0,y0,x1,y1,s)=>{const r=g.createLinearGradient(x0,y0,x1,y1);s.forEach(([o,c])=>r.addColorStop(o,c));return r};
const rg=(g,x,y,r0,r1,s)=>{const r=g.createRadialGradient(x,y,r0,x,y,r1);s.forEach(([o,c])=>r.addColorStop(o,c));return r};
function glow(g,x,y,r,a){g.fillStyle=rg(g,x,y,0,r,[[0,`rgba(255,255,255,${a})`],[1,'rgba(255,255,255,0)']]);g.fillRect(x-r,y-r,2*r,2*r)}
/* a human figure; feet at (x,y), height H. pose: stand | mic | guitar | hip | block. dress: legs | gown | coat */
function fig(g,x,y,H,o){o=o||{};const f=o.fill||'#0c0c0c',dress=o.dress||'legs',pose=o.pose||'stand',k=H/100;
  const P=(dx,dy)=>[x+dx*k,y+dy*k];
  g.fillStyle=f;g.strokeStyle=f;g.lineCap='round';g.lineJoin='round';

  g.beginPath();g.ellipse(x,y-88*k,5.6*k,6.8*k,0,0,6.2832);g.fill();
  if(o.hair==='long'){g.beginPath();g.moveTo(...P(-5.8,-92));g.quadraticCurveTo(...P(-9,-78),...P(-7.5,-66));g.lineTo(...P(7.5,-66));g.quadraticCurveTo(...P(9,-78),...P(5.8,-92));g.closePath();g.fill()}
  if(o.hat){g.beginPath();g.ellipse(x,y-93.5*k,9*k,2.2*k,0,0,6.2832);g.fill();g.fillRect(x-5*k,y-100*k,10*k,7*k)}

  g.fillRect(x-2.2*k,y-82*k,4.4*k,5*k);
  g.beginPath();g.moveTo(...P(-11,-77));g.quadraticCurveTo(...P(0,-80),...P(11,-77));
  if(dress==='coat'){g.lineTo(...P(12,-20));g.lineTo(...P(-12,-20))}else{g.lineTo(...P(8,-48));g.lineTo(...P(-8,-48))}
  g.closePath();g.fill();
  if(dress==='gown'){g.beginPath();g.moveTo(...P(-8,-50));g.lineTo(...P(8,-50));g.quadraticCurveTo(...P(12,-20),...P(20,0));g.lineTo(...P(-20,0));g.quadraticCurveTo(...P(-12,-20),...P(-8,-50));g.fill()}
  else{g.beginPath();g.moveTo(...P(-8.5,dress==='coat'?-22:-49));g.lineTo(...P(-9,0));g.lineTo(...P(-3,0));g.lineTo(...P(-0.6,-40));g.lineTo(...P(0.6,-40));g.lineTo(...P(3,0));g.lineTo(...P(9,0));g.lineTo(...P(8.5,dress==='coat'?-22:-49));g.closePath();g.fill()}
  // arms
  g.lineWidth=4.6*k;const arm=(...pts)=>{g.beginPath();g.moveTo(...P(...pts[0]));pts.slice(1).forEach(p=>g.lineTo(...P(...p)));g.stroke()};

  else if(pose==='guitar'){arm([9,-74],[10,-60],[2,-55]);arm([-9,-74],[-14,-62],[-24,-66])}
  else if(pose==='hip'){arm([9,-74],[18,-60],[9,-50]);arm([-9,-74],[-11,-58],[-10,-44])}
  else if(pose==='block'){arm([9,-74],[18,-72],[24,-86])}
  else{arm([9,-74],[11,-58],[10,-44]);arm([-9,-74],[-11,-58],[-10,-44])}}

  const P=(x,y)=>[w*x,h*y];g.beginPath();g.moveTo(...P(1,1));g.lineTo(...P(1,.8));g.quadraticCurveTo(...P(.97,.72),...P(.87,.7));g.quadraticCurveTo(...P(.8,.66),...P(.82,.56));
  g.quadraticCurveTo(...P(.9,.4),...P(.84,.24));g.quadraticCurveTo(...P(.76,.12),...P(.62,.13));g.quadraticCurveTo(...P(.5,.14),...P(.47,.24));g.quadraticCurveTo(...P(.46,.29),...P(.44,.31));

<script>
// halftone with light dots: bright areas print as large cream dots on ink (the photo is a positive on a dark page)
function halftoneLight(draw,w,h,o){const cell=o.cell,dot=o.dot,bg=o.bg;
  const a=document.createElement('canvas');a.width=w;a.height=h;const g=a.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,w,h);draw(g,w,h);
  const b=document.createElement('canvas');b.width=w;b.height=h;const gb=b.getContext('2d');gb.filter='blur(1.4px)';gb.drawImage(a,0,0);
  const d=gb.getImageData(0,0,w,h).data,L=(x,y)=>{x=Math.max(0,Math.min(w-1,x|0));y=Math.max(0,Math.min(h-1,y|0));const i=(y*w+x)*4;return(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255};
  const out=document.createElement('canvas');out.width=w;out.height=h;const c=out.getContext('2d');c.fillStyle=bg;c.fillRect(0,0,w,h);c.fillStyle=dot;
  const an=Math.PI/4,ca=Math.cos(an),sa=Math.sin(an),D=Math.hypot(w,h);
  for(let v=-D;v<D;v+=cell)for(let u=-D;u<D;u+=cell){const x=u*ca-v*sa+w/2,y=u*sa+v*ca+h/2;if(x<-2||y<-2||x>w+2||y>h+2)continue;
    const l=Math.pow(L(x,y),1.1);const r=Math.sqrt(l)*cell*.6;if(r>.4){c.beginPath();c.arc(x,y,r,0,6.2832);c.fill()}}
  return out.toDataURL()}
function titleScene(g,w,h){
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  // the spotlight's cone and its pool
  g.fillStyle='rgba(255,255,255,.16)';g.beginPath();g.moveTo(w*.47,0);g.lineTo(w*.53,0);g.lineTo(w*.66,h*.88);g.lineTo(w*.34,h*.88);g.closePath();g.fill();
  glow(g,w*.5,h*.6,h*.42,.75);glow(g,w*.5,h*.66,h*.22,.6);
  g.fillStyle='#262626';g.fillRect(0,h*.84,w,h*.16);
  g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.ellipse(w*.5,h*.865,w*.15,h*.035,0,0,6.2832);g.fill();
  // the singer at the mic
  fig(g,w*.5,h*.865,h*.5,{pose:'mic',fill:'#000'});
  g.strokeStyle='#000';g.lineWidth=4;g.beginPath();g.moveTo(w*.508,h*.865-h*.5*.84);g.lineTo(w*.522,h*.865);g.stroke();
  // the photographers' flashes, and their cameras in the foreground
  [[.07,.44,.22],[.93,.38,.2],[.81,.76,.12],[.19,.79,.13]].forEach(([x,y,r])=>glow(g,w*x,h*y,h*r,1));
  g.fillStyle='#000';[[.05,.97],[.95,.98],[.22,1.03],[.79,1.04]].forEach(([cx,cy])=>{g.fillRect(w*cx-h*.11,h*cy-h*.09,h*.22,h*.18);g.beginPath();g.arc(w*cx,h*cy,h*.07,0,6.2832);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(w*cx,h*cy,h*.022,0,6.2832);g.fill();g.fillStyle='#000'});
  for(let i=0;i<26;i++){const x=w*(i/25)+((i*37)%13)-6,s=h*(.075+((i*13)%7)*.006),y=h+s*.25;g.fillStyle='#000';g.beginPath();g.ellipse(x,y-s*.55,s*.3,s*.36,0,0,6.2832);g.fill();g.fillRect(x-s*.55,y-s*.28,s*1.1,s)}
}
document.getElementById('photo').style.backgroundImage=`url(${halftoneLight(titleScene,1280,720,{cell:7,dot:'#cfc6b2',bg:'#15120E'})})`;
document.fonts.ready.then(()=>document.body.dataset.ready='1');
